services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlp
      POSTGRES_PASSWORD: dlp
      POSTGRES_DB: dlp
    ports:
      - "5433:5432"
    volumes:
      - dlp_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp -d dlp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dlp:dlp@postgres:5432/dlp
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  dlp_postgres_data:
